<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Helvetica Neue', sans-serif;
            background: #ffffff;
            color: #2d2d2d;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            letter-spacing: -0.3px;
        }

        .hidden {
            display: none !important;
        }

        /* ===== AUTH SCREEN ===== */
        #auth-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #ffffff;
        }

        .auth-box {
            width: 100%;
            max-width: 380px;
            padding: 48px 32px;
            background: #ffffff;
        }

        .auth-box h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #0a0e27;
            letter-spacing: -0.8px;
            line-height: 1.2;
        }

        .auth-subtitle {
            font-size: 14px;
            color: #565869;
            margin-bottom: 32px;
            font-weight: 400;
        }

        .auth-box input {
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 12px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: #ffffff;
            color: #0a0e27;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .auth-box input:focus {
            outline: none;
            border-color: #2d2d2d;
            box-shadow: 0 0 0 3px rgba(45, 45, 45, 0.1);
        }

        .auth-box input::placeholder {
            color: #9ca3af;
        }

        .auth-box button {
            width: 100%;
            padding: 10px 16px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }

        .auth-box button:first-of-type {
            background: #0a0e27;
            color: white;
            margin-top: 16px;
        }

        .auth-box button:first-of-type:hover {
            background: #1a1f3a;
        }

        .auth-box .btn-secondary {
            background: transparent;
            color: #0a0e27;
            border: 1px solid #d0d5dd;
            margin-top: 12px;
        }

        .auth-box .btn-secondary:hover {
            background: #f5f5f7;
        }

        #auth-error {
            color: #dc2626;
            font-size: 13px;
            margin-top: 16px;
            text-align: center;
            min-height: 20px;
        }

        /* ===== MAIN APP LAYOUT ===== */
        #app-container {
            display: flex;
            height: 100vh;
            background: #ffffff;
        }

        /* ===== SIDEBAR ===== */
        #sidebar {
            width: 260px;
            background: #ffffff;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            padding: 16px;
            flex-shrink: 0;
            transition: width 0.3s ease, padding 0.3s ease;
            overflow: hidden;
        }

        #sidebar.collapsed {
            width: 0;
            padding: 0;
            border-right: none;
        }

        /* Toggle button */
        #toggle-sidebar-btn {
            position: fixed;
            left: 0;
            top: 16px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            color: #2d2d2d;
            cursor: pointer;
            font-size: 20px;
            padding: 8px 10px;
            border-radius: 0 8px 8px 0;
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        #toggle-sidebar-btn:hover {
            background: #f5f5f7;
            border-color: #d0d5dd;
        }

        #sidebar.collapsed ~ #toggle-sidebar-btn {
            display: flex;
        }

        /* Sidebar header */
        .sidebar-header {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .new-chat-btn {
            flex: 1;
            padding: 10px 14px;
            background: #f5f5f7;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            color: #0a0e27;
        }

        .new-chat-btn:hover {
            background: #ececf1;
            border-color: #d0d5dd;
        }

        .collapse-btn {
            padding: 10px 12px;
            background: transparent;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            color: #6b7280;
            transition: all 0.2s;
            font-family: inherit;
        }

        .collapse-btn:hover {
            background: #f5f5f7;
            border-color: #d0d5dd;
        }

        /* History section */
        .history-section {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            margin-top: 16px;
            margin-bottom: 16px;
        }

        .history-title {
            font-size: 11px;
            font-weight: 600;
            color: #9ca3af;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        #history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        #history-list::-webkit-scrollbar {
            width: 6px;
        }

        #history-list::-webkit-scrollbar-track {
            background: transparent;
        }

        #history-list::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 3px;
        }

        #history-list::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #565869;
            background: transparent;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s;
            border-left: 2px solid transparent;
            font-weight: 400;
        }

        .history-item:hover {
            background: #f5f5f7;
            color: #0a0e27;
            border-left-color: #6b7280;
        }

        .history-item.active {
    background: #ececf1;
    color: #0a0e27;
    border-left-color: #0a0e27;
    font-weight: 500;
}

        /* User area */
        .user-area {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            gap: 12px;
        }

        #display-user {
            font-size: 13px;
            color: #565869;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        .logout-btn {
            padding: 8px 12px;
            background: transparent;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            color: #565869;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            font-family: inherit;
        }

        .logout-btn:hover {
            background: #f5f5f7;
            color: #0a0e27;
        }

        /* ===== CHAT AREA ===== */
        #chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            overflow: hidden;
        }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 24px 40px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        #chat-box::-webkit-scrollbar {
            width: 8px;
        }

        #chat-box::-webkit-scrollbar-track {
            background: transparent;
        }

        #chat-box::-webkit-scrollbar-thumb {
            background: #e5e7eb;
            border-radius: 4px;
        }

        /* Messages */
        .msg {
            display: flex;
            margin-bottom: 8px;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg-user {
            justify-content: flex-end;
        }

        .msg-user .msg-content {
            background: #0a0e27;
            color: #ffffff;
            max-width: 70%;
        }

        .msg-ai {
            justify-content: flex-start;
        }

        .msg-ai .msg-content {
            background: #f5f5f7;
            color: #0a0e27;
            max-width: 70%;
        }

        .msg-content {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            font-weight: 400;
        }

        /* Input area */
        .input-container {
            padding: 16px 40px 24px 40px;
            background: #ffffff;
            flex-shrink: 0;
            border-top: 1px solid #e5e7eb;
        }

        .input-box {
            display: flex;
            gap: 8px;
            background: #ffffff;
            border: 1px solid #d0d5dd;
            border-radius: 12px;
            padding: 8px 12px;
            transition: all 0.2s;
        }

        .input-box:focus-within {
            border-color: #2d2d2d;
            box-shadow: 0 0 0 3px rgba(45, 45, 45, 0.1);
        }

        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            font-size: 14px;
            color: #0a0e27;
            outline: none;
            font-family: inherit;
            font-weight: 400;
        }

        .input-box input::placeholder {
            color: #9ca3af;
        }

        .input-box button {
            padding: 8px 16px;
            background: #0a0e27;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            font-family: inherit;
        }

        .input-box button:hover {
            background: #1a1f3a;
        }

        .input-box button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="auth-screen">
        <div class="auth-box">
            <h1>Claude</h1>
            <p class="auth-subtitle">Sign in to your account</p>
            
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            
            <button id="login-btn">Sign in</button>
            <button id="register-btn" class="btn-secondary">Create account</button>
            
            <p id="auth-error"></p>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-container" class="hidden">
        
        <!-- Toggle button (hidden by default) -->
        <button id="toggle-sidebar-btn" title="Show sidebar">☰</button>
        
        <!-- SIDEBAR -->
        <div id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" id="new-chat-btn">
                    <span>+</span> New chat
                </button>
                <button class="collapse-btn" id="collapse-btn" title="Collapse sidebar">−</button>
            </div>
            
            <div class="history-section">
                <div class="history-title">Recent</div>
                <div id="history-list"></div>
            </div>
            
            <div class="user-area">
                <span id="display-user">User</span>
                <button class="logout-btn" id="logout-btn">Logout</button>
            </div>
        </div>
        
        <!-- CHAT AREA -->
        <div id="chat-area">
            <div id="chat-box"></div>
            
            <div class="input-container">
                <div class="input-box">
                    <input type="text" id="message-input" placeholder="Message Claude...">
                    <button id="send-btn">Send</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="renderer.js"></script>
</body>
</html>
